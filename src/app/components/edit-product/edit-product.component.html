<div class="container mt-2">
  <mat-card class="p-4 shadow-sm w-75 m-auto">
    <h4 class="text-center mb-4">
      {{ productID ? "Update Product" : "Add New Product" }}
    </h4>

    <form [formGroup]="editProductForm" (ngSubmit)="submitForm()">
      
      <!-- Row 1: Product Title & Price -->
      <div class="row">
        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100 my-2">
            <mat-label>Product Title</mat-label>
            <input matInput placeholder="Enter product title" formControlName="title" />
            <mat-error *ngIf="editProductForm.controls['title'].invalid && editProductForm.controls['title'].touched">
              Title is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field appearance="outline" class="w-100 my-2">
            <mat-label>Price ($)</mat-label>
            <input matInput type="number" placeholder="Enter product price" formControlName="price" />
            <mat-error *ngIf="editProductForm.controls['price'].invalid && editProductForm.controls['price'].touched">
              Price is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <!-- Category (Full Width) -->
      <div class="row">
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="w-100 my-2">
            <mat-label>Category</mat-label>
            <mat-select formControlName="category">
              <mat-option *ngFor="let item of categoriesList" [value]="item">{{ item }}</mat-option>
            </mat-select>
            <mat-error *ngIf="editProductForm.controls['category'].invalid && editProductForm.controls['category'].touched">
              Category is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <!-- Description (Full Width) -->
      <div class="row">
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="w-100 my-2">
            <mat-label>Description</mat-label>
            <textarea matInput rows="3" placeholder="Enter product description" formControlName="description"></textarea>
            <mat-error *ngIf="editProductForm.controls['description'].invalid && editProductForm.controls['description'].touched">
              Description is required
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <!-- Row: Image URL & File Upload (Full Width Each) -->
      <div class="row">
        <div class="col-md-12">
          <mat-form-field appearance="outline" class="w-100 my-2">
            <mat-label>Product Image URL</mat-label>
            <input matInput type="url" placeholder="Enter image URL" formControlName="image" (input)="updateImagePreview()" />
            <mat-error *ngIf="editProductForm.controls['image'].invalid && editProductForm.controls['image'].touched">
              Image URL is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-md-12">
          <input type="file" class="form-control my-2" (change)="onFileSelected($event)" accept="image/*" />
        </div>
      </div>

      <!-- Image Preview -->
      <div class="text-center mb-2">
        <img *ngIf="imagePreview" [src]="imagePreview" alt="Product Image" class="img-thumbnail" width="200" height="200" />
      </div>

      <!-- Submit Button -->
      <div class="text-center mt-3">
        <button mat-flat-button color="primary" type="submit" [disabled]="editProductForm.invalid">
          {{ productID ? "Update Product" : "Add Product" }}
        </button>
      </div>

    </form>
  </mat-card>
</div>
